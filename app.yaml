apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: client
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date) ---"
                psql -h todo-db-rw -U app -d app -c "SELECT * FROM todos;"
                sleep 5
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db-app
                  key: password
